name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 基础检查
    runs-on: ubuntu-latest
    outputs:
      regular: ${{ steps.list.outputs.regular }}
      docker: ${{ steps.list.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: make check
      - id: list
        run: |
          echo "regular=$(python3 shared/scripts/list-experiments.py regular | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "docker=$(python3 shared/scripts/list-experiments.py regular-docker | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  regular:
    name: ${{ matrix.exp }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exp: ${{ fromJSON(needs.check.outputs.regular) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: make verify EXP=${{ matrix.exp }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ strategy.job-index }}-regular
          path: |
            ${{ matrix.exp }}/build/run
            ${{ matrix.exp }}/target/run
          if-no-files-found: ignore

  regular-docker:
    name: ${{ matrix.exp }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exp: ${{ fromJSON(needs.check.outputs.docker) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: make verify EXP=${{ matrix.exp }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ strategy.job-index }}-docker
          path: |
            ${{ matrix.exp }}/build/run
            ${{ matrix.exp }}/target/run
          if-no-files-found: ignore
      - if: always()
        run: make clean EXP=${{ matrix.exp }} || true
