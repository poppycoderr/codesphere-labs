# 1 个独立 controller + 3 个 broker（KRaft），只在 compose 网络内可达。
# controller 单独部署，停掉两个 broker 之后控制面仍然可用，ISR 才能收缩到只剩 leader。
x-kafka: &kafka
  image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
  cpus: 1
  mem_limit: 1g
x-env: &env
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 100@controller:9093
  CLUSTER_ID: csl-kafka-delivery-001
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
x-broker-env: &broker-env
  <<: *env
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENERS: PLAINTEXT://:9092
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # 跟不上的副本 5 秒后移出 ISR（默认 30 秒），缩短实验时间
  KAFKA_REPLICA_LAG_TIME_MAX_MS: 5000
x-broker-health: &broker-health
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
  interval: 3s
  timeout: 10s
  retries: 60
services:
  controller:
    <<: *kafka
    hostname: controller
    environment:
      <<: *env
      KAFKA_PROCESS_ROLES: controller
      KAFKA_NODE_ID: 100
      KAFKA_LISTENERS: CONTROLLER://:9093
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-controller localhost:9093 describe --status >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 60
  kafka1:
    <<: *kafka
    hostname: kafka1
    depends_on: { controller: { condition: service_healthy } }
    healthcheck: *broker-health
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
  kafka2:
    <<: *kafka
    hostname: kafka2
    depends_on: { controller: { condition: service_healthy } }
    healthcheck: *broker-health
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
  kafka3:
    <<: *kafka
    hostname: kafka3
    depends_on: { controller: { condition: service_healthy } }
    healthcheck: *broker-health
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
