# 单节点 Redis 8.10.1，固定 digest；关闭持久化（fork 场景手动 BGSAVE），延迟监控阈值 1ms。
# 探测客户端与压测客户端运行在共享该容器网络的 JDK 21 容器中。不对宿主机暴露端口
name: csl-redis-latency
services:
  redis:
    image: redis:8.10.1@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
    command: ["redis-server", "--save", "", "--appendonly", "no", "--latency-monitor-threshold", "1", "--slowlog-log-slower-than", "10000", "--slowlog-max-len", "256"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
