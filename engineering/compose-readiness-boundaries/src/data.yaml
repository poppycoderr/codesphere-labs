# 项目内声明的卷与一个外部卷
services:
  svc:
    image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    command: ["sh", "-c", "echo hello > /data/f; echo hello > /shared/f; sleep 600"]
    volumes: ["data:/data", "shared:/shared"]
volumes:
  data: {}
  shared:
    external: true
    name: csl-crb-shared
