# 等到 db 健康才启动 app
services:
  db:
    image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    command: ["sh", "-c", "sleep 5; while true; do echo ok | nc -l -p 8080; done"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 1s
      retries: 30
  app:
    image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "if nc -z -w 2 db 8080; then echo connected; else echo refused; fi; sleep 600"]
