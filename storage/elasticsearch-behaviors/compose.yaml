# 单节点 Elasticsearch 9.5.3，固定 digest；关闭安全认证，只在本地容器网络内访问，不对宿主机暴露端口。
# 默认线程池；线程池实验叠加 compose.pool.yaml
name: csl-elasticsearch
services:
  es:
    image: elasticsearch:9.5.3@sha256:a4e2b3d21ad0f779f3044bb6828b5289d5f1c241b3ddd7efae7adaf81bcff412
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 60
