# PSA 副本集：两个数据节点 m1、m2 与一个仲裁节点 arb，MongoDB 9.0.4，不暴露宿主机端口
x-mongo: &mongo
  image: mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8
  command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
  cpus: 1
  mem_limit: 768m
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 2s
    timeout: 5s
    retries: 60
services:
  m1: *mongo
  m2: *mongo
  arb: *mongo
