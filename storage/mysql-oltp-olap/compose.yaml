# MySQL 8.4.11 与 ClickHouse 25.8 各限制 2 CPU、3 GB 内存；不对宿主机暴露端口
name: csl-oltp-olap
services:
  mysql:
    image: mysql:8.4.11@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    environment:
      MYSQL_ROOT_PASSWORD: example_password
      MYSQL_DATABASE: labs
    volumes:
      - ./config/mysql.cnf:/etc/mysql/conf.d/labs.cnf:ro
    cpus: 2
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pexample_password", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    environment:
      CLICKHOUSE_DB: labs
      CLICKHOUSE_USER: labs
      CLICKHOUSE_PASSWORD: example_password
    cpus: 2
    mem_limit: 3g
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "labs", "--password", "example_password", "-q", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 60
