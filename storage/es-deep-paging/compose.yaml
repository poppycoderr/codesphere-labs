# 单节点 Elasticsearch 9.5.5，固定 digest；关闭安全认证，只在本地容器网络内访问，不对宿主机暴露端口
services:
  es:
    image: elasticsearch:9.5.5@sha256:33cae13fc18ef105e960cdd32327d402fbd7c6d4376c0b879ad703ee289d45d8
    environment:
      node.name: es-lab
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    cpus: 2
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 60
