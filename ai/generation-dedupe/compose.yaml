# Redis 8.10.1，固定 digest，同一个网络；Python 客户端容器接入这个网络，不对宿主机暴露端口（生成结果去重实验）
name: csl-generation-dedupe
services:
  redis:
    image: redis:8.10.1@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
