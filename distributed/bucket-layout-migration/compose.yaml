# Redis 8.10.1，固定 digest，同一个网络；客户端 JDK 容器接入这个网络，不对宿主机暴露端口（分桶库存布局迁移实验）
name: csl-bucket-layout
services:
  redis:
    image: redis:8.10.1@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    cpus: 2
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
