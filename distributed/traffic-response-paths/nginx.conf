events {}
http {
  access_log off;
  upstream backend { server good:8000; }
  upstream retry { server bad:8000 max_fails=0; server good:8000 backup; }
  server {
    listen 8080;
    location /r302 { return 302 /echo; }
    location /r307 { return 307 /echo; }
    location /retry-off { proxy_pass http://retry; proxy_next_upstream http_503; proxy_next_upstream_tries 2; }
    location /retry-on { proxy_pass http://retry; proxy_next_upstream http_503 non_idempotent; proxy_next_upstream_tries 2; }
    location / { proxy_pass http://backend; proxy_set_header X-Forwarded-For $remote_addr; }
  }
}
